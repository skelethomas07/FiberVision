# SEM fiber AI v7.0.0 - default configuration
#
# Sections marked PROTOCOL define the scientific experiment.  They are hashed
# into every checkpoint and manifest and NEVER depend on hardware.  The
# `hardware` section holds performance-only knobs.

seed: 1337
deterministic: true

# ---------------------------------------------------------------- PROTOCOL --
protocol:                         # FULL_RUN (requires CUDA)
  tile: 384
  effective_batch: 8              # fixed; micro-batch x accumulation = this
  epochs: 80
  patience: 15                    # early stop on val_monitor only
  lr: 0.0003
  weight_decay: 0.0001
  samples_per_image: 32
  val_samples_per_image: 8
  monitor: val_monitor            # uncertainty-free validation loss

smoke_protocol:                   # FAST_SMOKE_TEST (CPU ok) - NOT a scientific run
  tile: 128
  effective_batch: 2
  epochs: 2
  patience: 2
  lr: 0.001
  weight_decay: 0.0001
  samples_per_image: 4
  val_samples_per_image: 2
  monitor: val_monitor
smoke_model:
  preset: tiny

model:                            # PROTOCOL
  preset: small                   # tiny | small | medium | large
  in_channels: 1
  dropout: 0.0

targets:                          # PROTOCOL
  mode: geometry                  # geometry | baseline (kept for comparison)
  orientation_source: image
  coherency_min: 0.25
  log_width: true
  propagate_scale: 6.0
  propagate_max_scale: 20.0
  unverified_weight: 0.3
  strata_edges: [0.0, 6.0, 9.0, 13.0, 18.0, 25.0, 1000000000.0]
  strata_weight_cap: 6.0

loss:
  uncertainty: true
loss_weights:                     # PROTOCOL
  center: 1.0
  segment: 0.5
  width: 1.0
  orient: 0.5
  validity: 0.3
  dist: 1.0

augment:                          # PROTOCOL
  enabled: true
  hflip: 0.5
  vflip: 0.5
  rot90: 0.5
  rotate_deg: 20.0
  scale_range: [0.8, 1.25]        # isotropic only
  translate_frac: 0.05
  brightness: 0.12
  contrast: 0.12
  gamma: [0.85, 1.18]
  noise_std: 4.0
  blur_prob: 0.15
  blur_sigma: [0.4, 1.0]

prior:                            # image-derived fibre mask / orientation field
  sigmas: [1.0, 1.6, 2.5, 4.0, 6.0]
  threshold: otsu
  dilate_px: 2
  min_object_px: 24
  tensor_sigma: 2.0
  coherency_min: 0.25
  polarity: auto
  flank_scale: 2.2
  area_max: 0.85
  area_min: 0.05
  auc_min: 0.75
  auto_area: true
  min_coverage: 0.85

split:                            # PROTOCOL
  level: specimen                 # specimen | series | image
  specimen_map: null              # optional yaml {image_id: specimen}
  duplicate_hamming: 6
  val_frac: 0.25
  test_frac: 0.25
  stratify: true

physical:                         # PROTOCOL
  resample_to_reference: auto     # auto | on | off
  min_calibrated_fraction: 0.7
  factor_range: [0.4, 2.5]

postprocess:                      # defaults; spacing/thresholds are SELECTED on validation
  mode: geometry
  seg_threshold: 0.5
  min_validity: 0.3
  spacing_px: 12.0
  min_width_px: 2.0
  max_width_px: 200.0
  boundary_tol: 0.35
  border_px: 6
  peak_threshold: 0.3             # baseline mode only
  nms_radius: 7                   # baseline mode only

selection:                        # validation-only selection
  objective: fiber_wasserstein_relative
  min_recall_frac: 0.85
  spacing_grid: [8.0, 12.0, 16.0, 24.0]
  validity_grid: [0.0, 0.2, 0.4]
  seg_grid: [0.4, 0.5, 0.6]

evaluate:
  match_distance_scale: 1.5
  match_min_distance_px: 8.0
  match_max_angle_deg: 30.0
  bootstrap: 1000
  min_groups_for_ci: 5

hardware:                         # performance only
  precision: auto                 # auto | bf16 | fp16 | fp32
  compile: false
  train_locally: true

thick_experimental:
  enabled: false                  # experimental; never pooled unless validated on real GT
  min_width_px: 18.0
  max_width_px: 160.0
  spacing_px: 14.0
  min_coherence: 0.45
  validation:
    min_sites: 30
    min_precision: 0.7
    min_recall: 0.5
    max_median_rel_error: 0.15
    max_p90_rel_error: 0.2
